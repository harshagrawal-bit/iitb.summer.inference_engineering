<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" role="img" aria-label="MLIE / IIT Bombay emblem">
  <defs>
    <linearGradient id="g" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#123a63"/>
      <stop offset="1" stop-color="#0a2540"/>
    </linearGradient>
  </defs>
  <!-- gear ring -->
  <g fill="#0a2540">
    <circle cx="50" cy="50" r="47" fill="url(#g)"/>
    <circle cx="50" cy="50" r="47" fill="none" stroke="#e0651a" stroke-width="2.5"/>
  </g>
  <g fill="none" stroke="#c8941f" stroke-width="1.6" opacity=".8">
    <circle cx="50" cy="50" r="39"/>
  </g>
  <!-- open book base -->
  <path d="M22 64 Q50 56 78 64 L78 70 Q50 62 22 70 Z" fill="#c8941f"/>
  <path d="M50 58 L50 70" stroke="#0a2540" stroke-width="1.5"/>
  <!-- neural net / inference motif -->
  <g stroke="#7fb0e0" stroke-width="1.4" opacity=".9">
    <line x1="34" y1="34" x2="50" y2="26"/>
    <line x1="34" y1="34" x2="50" y2="44"/>
    <line x1="66" y1="34" x2="50" y2="26"/>
    <line x1="66" y1="34" x2="50" y2="44"/>
    <line x1="50" y1="26" x2="50" y2="44"/>
  </g>
  <g fill="#e0651a">
    <circle cx="34" cy="34" r="4.2"/>
    <circle cx="66" cy="34" r="4.2"/>
  </g>
  <g fill="#fff">
    <circle cx="50" cy="26" r="4.6"/>
    <circle cx="50" cy="44" r="4.6"/>
  </g>
  <text x="50" y="90" text-anchor="middle" font-family="Georgia, serif" font-size="10" fill="#dbe7f3" letter-spacing="2">MLIE</text>
</svg>
