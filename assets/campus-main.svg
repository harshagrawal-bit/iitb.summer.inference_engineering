<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 520" role="img" aria-label="IIT Bombay Main Building">
<defs>
  <linearGradient id="sk" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#bcd6f2"/><stop offset="1" stop-color="#e9f2fb"/></linearGradient>
  <linearGradient id="bd" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#d9c19a"/><stop offset="1" stop-color="#c2a172"/></linearGradient>
</defs>
<rect width="800" height="520" fill="url(#sk)"/>
<!-- hills -->
<path d="M0 250 Q200 200 400 245 T800 235 V300 H0Z" fill="#9fc08a" opacity=".7"/>
<path d="M0 270 Q260 235 520 268 T800 262 V320 H0Z" fill="#84ad6f" opacity=".7"/>
<!-- lawn -->
<rect x="0" y="430" width="800" height="90" fill="#8fbf6e"/>
<rect x="0" y="430" width="800" height="14" fill="#7fae5e"/>
<!-- main building -->
<g>
  <rect x="120" y="250" width="560" height="190" fill="url(#bd)"/>
  <!-- central tower -->
  <rect x="350" y="170" width="100" height="270" fill="#d2b78d"/>
  <rect x="368" y="120" width="64" height="60" fill="#c8a878"/>
  <polygon points="360,170 440,170 400,135" fill="#a9743f"/>
  <rect x="394" y="95" width="12" height="30" fill="#8a5a2b"/>
  <!-- colonnade arches -->
  <g fill="#7a5a33">
    <rect x="150" y="360" width="26" height="80" rx="13"/><rect x="200" y="360" width="26" height="80" rx="13"/><rect x="250" y="360" width="26" height="80" rx="13"/><rect x="300" y="360" width="26" height="80" rx="13"/>
    <rect x="474" y="360" width="26" height="80" rx="13"/><rect x="524" y="360" width="26" height="80" rx="13"/><rect x="574" y="360" width="26" height="80" rx="13"/><rect x="624" y="360" width="26" height="80" rx="13"/>
  </g>
  <!-- windows -->
  <g fill="#5b7fa6">
    <rect x="150" y="285" width="20" height="34"/><rect x="190" y="285" width="20" height="34"/><rect x="230" y="285" width="20" height="34"/><rect x="270" y="285" width="20" height="34"/><rect x="310" y="285" width="20" height="34"/>
    <rect x="490" y="285" width="20" height="34"/><rect x="530" y="285" width="20" height="34"/><rect x="570" y="285" width="20" height="34"/><rect x="610" y="285" width="20" height="34"/>
    <rect x="372" y="195" width="16" height="28"/><rect x="412" y="195" width="16" height="28"/>
    <rect x="384" y="240" width="32" height="46" fill="#3f648c"/>
  </g>
</g>
<!-- foreground trees -->
<g>
  <circle cx="60" cy="410" r="36" fill="#5e9447"/><rect x="55" y="430" width="10" height="30" fill="#7a5a33"/>
  <circle cx="740" cy="415" r="40" fill="#5e9447"/><rect x="735" y="438" width="10" height="32" fill="#7a5a33"/>
</g>
</svg>
