<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 520" role="img" aria-label="Powai Lake by IIT Bombay">
<defs>
  <linearGradient id="sk2" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#9cc2ec"/><stop offset="1" stop-color="#dcecfb"/></linearGradient>
  <linearGradient id="lk" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#6fa8d8"/><stop offset="1" stop-color="#3f7cb0"/></linearGradient>
</defs>
<rect width="800" height="520" fill="url(#sk2)"/>
<circle cx="650" cy="110" r="46" fill="#fff7e0" opacity=".9"/>
<!-- far hills -->
<path d="M0 230 Q160 170 340 220 T800 200 V300 H0Z" fill="#7fa86a" opacity=".8"/>
<path d="M0 255 Q220 215 460 252 T800 240 V320 H0Z" fill="#5f8d50" opacity=".85"/>
<!-- skyline silhouette on far shore -->
<g fill="#46708f" opacity=".55">
  <rect x="120" y="250" width="20" height="40"/><rect x="150" y="235" width="16" height="55"/><rect x="300" y="245" width="24" height="45"/><rect x="500" y="240" width="18" height="50"/><rect x="560" y="252" width="22" height="38"/>
</g>
<!-- lake -->
<rect x="0" y="300" width="800" height="220" fill="url(#lk)"/>
<g stroke="#cfe6fa" stroke-width="3" opacity=".5">
  <line x1="60" y1="340" x2="180" y2="340"/><line x1="300" y1="360" x2="470" y2="360"/><line x1="520" y1="335" x2="660" y2="335"/><line x1="160" y1="400" x2="360" y2="400"/><line x1="430" y1="430" x2="640" y2="430"/>
</g>
<!-- reflection of sun -->
<rect x="636" y="300" width="28" height="220" fill="#fff7e0" opacity=".18"/>
<!-- reeds -->
<g stroke="#3c6b3a" stroke-width="4" fill="none">
  <path d="M40 300 q4 -40 0 -70"/><path d="M52 300 q6 -34 2 -60"/><path d="M28 300 q-4 -30 0 -52"/>
</g>
</svg>
